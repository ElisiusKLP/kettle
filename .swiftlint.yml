included:
  - Sources
  - Tests
  - Package.swift
excluded:
  - .build
  - build

disabled_rules:
  - trailing_comma # SwiftFormat owns commas
  - opening_brace # SwiftFormat owns brace placement

opt_in_rules:
  - closure_spacing
  - contains_over_first_not_nil
  - empty_count
  - empty_string
  - explicit_init
  - first_where
  - last_where
  - modifier_order
  - redundant_nil_coalescing
  - sorted_first_last
  - toggle_bool

line_length:
  warning: 120
  error: 160
  ignores_comments: true

identifier_name:
  min_length: 1
  excluded: [id]

type_name:
  min_length: 2
